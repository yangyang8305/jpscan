[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpscan"
version = "0.1.0"
description = "日本上市股票全量扫描、分析与组合构建工具（本地优先、全量采集、可复现）"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.1",
  "pyyaml>=6",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
  "feedparser>=6",
  "pypdf>=4",
  "anthropic>=0.60",
  "typer>=0.12",
  "rich>=13",
  "lxml>=5",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jpscan = "jpscan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
