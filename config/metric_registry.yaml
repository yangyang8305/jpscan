  # ---------- 指引变化 ----------
  - id: guid_forecast_innovation
    family: guidance_change
    aliases: [SUPF, NEXT_FY_GUIDANCE]
    name_zh: "翌期指引意外"
    plain_zh: "公司发年报时，给的明年利润预测比今年实际高多少（相对市值）。"
    purpose: catalyst_event
    direction: higher_better
    formula: "仅 FY 决算行：(NxFOdP − OdP)/(MktCap*1e6)；IFRS、美国准则无经常利益时用 (NxFOP − OP)，并按 gaap 分组比较；有效窗口为 DiscDate 后第 2 至第 60 个交易日。FY 行的 FOP 全空，要读 NxF* 字段。"
    data_needed: "financial_statements.NxFOP, NxFOdP, OP, OdP, gaap, DocType, CurPerType, DiscDate；valuation_daily.MktCap"
    available_on_free_plan: true
    free_plan_note: "FY 决算行 NxFOP 88%。读取时有 FY 行的只有 Prime 8%、Standard 13%、Growth 18%（3 月决算的 5 月数据大多未回填）。"
    stale_on_free: true
    unlocks_with: "回测：回填到 2025-05。实盘：J-Quants Light 以上去掉延迟；TDnet 摘要 XBRL 可免费拿到近实时的预想数字，但价格仍延迟。"
    sector_rules: "银行用 OdP；保险、证券不适用（预想多缺失）。商社改用 NP 与 FNP。"
    status: score
    planned_status: score
    evidence_strength: strong
    evidence: "日本最符合制度的信号。G2-19 Jinushi 2023（全文已读，2002-2020，60124 公司年）：指引意外对公告后 +2 至 +60 日异常收益的系数在所有样本中显著为正，同期的实绩意外几乎不显著；外资高或个人低的公司漂移在减弱。G2-14：公告反应主要来自翌期预想。https://www.rieb.kobe-u.ac.jp/tjar/article/vol13/pdf/13.01.Jinushi.pdf"
    why: "草案的 G3 用当期预想且混在成长分里。应单独成为事件信号。证据强但窗口正好落在 Free 的 12 周延迟之内，实盘须用无延迟数据。"

  - id: guid_revision_event
    family: guidance_change
    aliases: [N6, REVISION_EVENT]
    name_zh: "业绩预想修正"
    plain_zh: "财年中公司上调或下调全年利润预测的方向和幅度。"
    purpose: catalyst_event
    direction: higher_better
    formula: "implied_FNP = FwdEPS*(MktCap*1e6)/C；事件 = 非 FY 文档日前后的日变动绝对值>=1%；幅度 = Δimplied_FNP/(MktCap*1e6)，相对市值以防分母接近零。FY 决算当日 FwdEPS 切到下一财年，不算修正（实测占事件 24.5%），须用 financial_statements 的 CurPerType 剔除。有文档时用 DocType=EarnForecastRevision 的 FOP 变化核对。"
    data_needed: "valuation_daily.FwdEPS, MktCap；prices_daily.C；financial_statements.DocType, CurPerType, DiscDate, FOP"
    available_on_free_plan: true
    free_plan_note: "基础序列覆盖 Prime 95%、Standard 94%、Growth 85%；45 天内有事件的公司 Prime 21%、Standard 15%、Growth 12%。只反映净利预想，不反映 OP 修正。日期不早于披露后 D+1（实测 98.7%）。"
    stale_on_free: true
    unlocks_with: "实盘：TDnet 每日采集（E01、E02 事件近实时）；J-Quants Light 以上去掉延迟"
    sector_rules: "银行用 FOdP 与 FNP。证券不适用（预想缺失）。披露强制线为売上 ±10%、利益 ±30%，低于此线的变化可能不以修正事件出现。"
    status: score
    planned_status: score
    evidence_strength: moderate
    evidence: "G2-17（单篇，2012）：修正后 30 营业日 CAR 同向，低 PBR 股上修后跑赢。G2-14、G2-18。实测（单季 1Q，未扣成本，短窗口）：FwdEPS 上调>=1% 的 n=186 公司 5 日超额中位 +0.77%、胜率 58.6%；未变 n=745 为 −0.22%、45.4%。分析师修正是另一回事：S&P 2018 等摘要称修正策略在日本不奏效（未读全文）。三份评估的强度判断不一（从 moderate 到 strong），因缺近期独立复现，取 moderate。"
    why: "日本市场最重要的价格锚之一，Free 不必解析 XBRL 就能算（隐含值与文档 FNP 相差不足 1% 的占 91.8%）。只用 FwdEPS 差分会把回购当成上修，必须乘回股数。"

