    direction: lower_better
    formula: "AdjC(t)/AdjC(t−21) − 1 减去同 S33 中位；可跳过最近 1 日以减少买卖价差影响；只在流动性门槛内使用。"
    data_needed: "prices_daily.AdjC；security_master.S33"
    available_on_free_plan: true
    free_plan_note: "当日覆盖 99.8%。最差 10% 的分界约 −8.6%，命中 369 只，其中流动性核心池内 207 只。"
    stale_on_free: true
    unlocks_with: "实盘：J-Quants Light 以上去掉 12 周延迟"
    sector_rules: "无行业例外，但行业整体下跌不会触发，这是有意的。"
    status: score
    planned_status: score
    evidence_strength: moderate
    evidence: "存在性证据强但偏老：东证 1975-1997 研究；Chou-Wei-Chung 2007。KAKEN 20K01746：反转在超小型股中最强，那里成本也最高 https://kaken.nii.ac.jp/en/report/KAKENHI-PROJECT-20K01746/20K01746seika 。近期扣成本检验未找到。实测与所有估值、质量指标行业内秩相关都接近 0（绝对值不超过 0.15），是最独立的一条。"
    why: "错杀维度最有直接根据的学术信号。必须用保守成本检验，Free 上只能研究。"

  - id: rev_no_news_loser
    family: price_dislocation
    aliases: [T6, no_news]
    name_zh: "无消息下跌"
    plain_zh: "股价大跌但当时没有公司新闻的股票，反弹远比有坏消息的股票明显。"
    purpose: mispricing_oversold
    direction: flag
    formula: "rev_1m 命中，且窗口内最大单日相对跌幅日前后 ±1 日无决算文档（DiscDate、earnings_calendar.SchDate）、无 staging.disclosures 事件。staging.disclosures 未覆盖窗口时结果为 unknown。最大跌幅日的 +1 日在计算日 t 尚未观测时结果也为 unknown，回测不得使用 t 之后的信息。"
    data_needed: "prices_daily；financial_statements.DiscDate；earnings_calendar（只有 2026-06 起，历史回测只能用 PubDate<=t 的记录）；staging.disclosures"
    available_on_free_plan: true
    free_plan_note: "TDnet 缺失时只能排除决算新闻。实测 2026-08-14 核心池 192 个 rev_1m 命中中 90 个（47%）近旁没有决算文档，增资、丑闻、优待废止等坏消息的公司也在其中，若因此提高排序就是把缺失当通过。决算季跌幅>=10% 的股日只有 38% 在 ±1 日内有财务文档。"
    stale_on_free: true
    unlocks_with: "TDnet 每日采集（免费，错过的日子免费补不回来）；历史需 J-Quants TDnet 附加包"
    sector_rules: "无。"
    status: display
    planned_status: score
    evidence_strength: weak
    evidence: "Tsukioka 等 2017（JSAI 会议论文，1985-2010，数字表文本错位，全样本约 135% vs 45%，高频调仓的毛收益，不可直接交易）https://www.ai-gakkai.or.jp/jsai2017/webprogram/2017/paper-583.html ；Bremer 等 1997（已读摘要，作者判断普通投资者难以获利）https://www.cambridge.org/core/journals/journal-of-financial-and-quantitative-analysis/article/predictable-patterns-after-large-stock-price-changes-on-the-tokyo-stock-exchange/7EA5B0921EC83DDAEA4860FC279372AE 。样本止于 2010，后续复现未找到。"
    why: "对草案的方向性修正：归因表把无明确原因当作缺口，文献提示它可能是最好的一类。但证据只有会议论文和老样本，现在又分不清有没有消息，所以只展示。接入 TDnet 后走 promotion_rule 检验；转正时再写明提高排序的具体数值，它不算第二次命中。"

