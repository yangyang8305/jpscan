# ---------- 证据家族 ----------
# 一个家族回答一个问题。家族之间要尽量独立；同一家族内的指标可以相关，它们合起来只算一份证据。
# 判定结果四选一：
#   hit     达到阈值
#   miss    已知但未达到
#   fail    触发 fail_rule（只有部分家族有）
#   unknown 已知指标数少于 min_known。unknown 绝不算 hit，也绝不算 miss。
# absence_means：没有事件时算什么。no_signal 表示没有事件就是 miss；unknown 表示数据本身可能缺失。
# hit_rules.rule：
#   peer_best_pct    在同业（params.peer_group：S33，不足 20 只回退 S17）内排在最好的前 value 比例
#   group_best_pct   在 group 指定的分组内排在最好的前 value 比例；排名池 rank_pool_days 个交易日，window_days 只决定信号是否有效
#   universe_best_pct 在全市场排在最好的前 value 比例
#   min_value        指标值 >= value
#   event_up_top_pct 窗口内上调事件中，幅度排在前 value 比例；变动小于 noise_floor 不算事件
#   any_up_event     窗口内出现一次上调
#   min_reduction    指标值 >= value，只作是否判断，不作连续排序
# 阈值全部是先验：30% 沿用 params.value.core_metric_pct；不按任何收益结果调过。
family_policy:
  coverage_floor: 0.60          # 沿用 params.peer_group.min_metric_coverage_for_confidence；按市场分别计算
  ranking: "同一篮子内，按该股命中家族的指标同业分位等权平均排序；不按文献数字或样本内结果拟合权重。"
  note: "覆盖率低于 coverage_floor 的家族不能作必要条件，处理方式见 bucket_policy。每次运行重新计算覆盖率，回填或接入新数据后自动生效，无需改表。"

families:
  relative_value:
    name_zh: "相对估值"
    question_zh: "考虑赚钱能力和同业之后，它便宜吗？"
    metrics: [val_pbr, val_fwd_ep, val_ocf_yield]
    planned_metrics: [val_self_pbr_pct]
    challenger_metric: val_pbr_roe_residual
    absence_means: unknown
    threshold:
      min_known: 2
      min_hits: 2
      hit_rules:
        - {metric: val_pbr, rule: peer_best_pct, value: 0.30}
        - {metric: val_fwd_ep, rule: peer_best_pct, value: 0.30, unless_gate: gate_one_off}
        - {metric: val_ocf_yield, rule: peer_best_pct, value: 0.30}
    fail_rule: null
    measured:
      known_share: {Prime: 0.94, Standard: 0.90, Growth: 0.15}
      hits_all: 679
      hits_liquid_core: 317
    independence_note: "三条腿的行业内秩相关（核心池）：B/M 与 E/P 0.45，B/M 与现金流 0.41，E/P 与现金流约 0.35。残差移出前它与 E/P 为 0.85（Prime 全体 0.91），旧规则 8 成命中同时靠残差和 E/P，现金流不是必要条件。2-of-3 仍是一份证据。"
    evidence_summary: "价值是日本证据最多的方向（moderate 到 strong），但 2010 年后单独回报明显变弱，所以不单独成篮：见 B1 的确认条件。"

  shareholder_yield:
    name_zh: "股东回报"
    question_zh: "公司实际还给股东多少现金？"
    metrics: [yield_dividend, yield_net_payout]
    planned_metrics: []
    absence_means: unknown
    threshold:
      min_known: 1
      min_hits: 1
      hit_rules:
        - {metric: yield_dividend, rule: peer_best_pct, value: 0.30, unless_gate: gate_div_cover}
        - {metric: yield_net_payout, rule: peer_best_pct, value: 0.30}
    fail_rule: null
    measured:
      known_share: {Prime: 0.92, Standard: 0.91, Growth: 0.93}
      hits_all: 989
      hits_liquid_core: 566
    independence_note: "与 E/P 秩相关 0.43，与残差 0.38；命中名单与 relative_value 的 Jaccard 0.25（核心池）。有重叠，但并非同一批公司。"
    evidence_summary: "moderate：长期稳定，主要证据来自指数和卖方。"

  business_quality:
    name_zh: "经营质量"
    question_zh: "生意本身赚不赚钱、有没有在变好？"
    metrics: [qual_fscore7, qual_op_profitability]
    planned_metrics: []
    absence_means: unknown
    threshold:
      min_known: 1
      min_hits: 1
      hit_rules:
        - {metric: qual_fscore7, rule: min_value, value: 5}
        - {metric: qual_op_profitability, rule: peer_best_pct, value: 0.30}
    fail_rule: "qual_fscore7 <= 2（至少 5 项可算）"
    measured:
      known_share: {Prime: 0.08, Standard: 0.13, Growth: 0.18}
      hits_all: null
      hits_liquid_core: null
    independence_note: "OP/TA 与 B/M 秩相关 −0.30，与文献的价值、质量负相关一致，所以和估值搭配才有分散意义。"
    evidence_summary: "moderate 且有冲突：指数层面质量单独很弱，特征回归显示与价值合用有增量。读取时大部分未知，现在不能作必要条件，回填到 2025-05 后自动生效。"

  guidance_change:
    name_zh: "指引变化"
    question_zh: "公司对未来利润的说法刚刚变好了吗？"
    metrics: [guid_forecast_innovation, guid_revision_event]
    planned_metrics: [guid_bias, guid_q_sue, guid_earnings_reaction]
    absence_means: no_signal
    no_forecast_means: unknown    # 公司没有任何预想字段时不算 miss，见 gate_guidance_absent
    threshold:
      min_known: 1
      min_hits: 1
      hit_rules:
        - {metric: guid_forecast_innovation, rule: group_best_pct, group: basis, value: 0.30, window_days: 60, rank_pool_days: 250, unless_gate: gate_miss_then_bullish}
        - {metric: guid_revision_event, rule: event_up_top_pct, value: 0.30, window_days: 30, noise_floor: 0.01}
    fail_rule: "30 个交易日内 guid_revision_event 下调超过 noise_floor。guid_forecast_innovation 的负值只展示，不算 fail：相对排名的最差 30% 分界只有约 −0.5% 市值，日本公司又常有保守指引，这条曾否决 2026-06-30 核心池 32% 的估值命中；指引走低本身已压低 E/P。"
    measured:
      known_share: {Prime: 0.95, Standard: 0.94, Growth: 0.85}
      hits_all: 236
      hits_liquid_core: 100
      fails_liquid_core: 80
    independence_note: "隐含净利变动与估值、质量、股息的秩相关都不超过 0.23，与 1 个月跌幅 −0.27。"
    evidence_summary: "翌期指引 moderate（strong 只限低外资、高个人持股子样本），期中修正 moderate。窗口短于 Free 的 12 周延迟，Free 上只能研究。"

  capital_action:
    name_zh: "资本行动"
    question_zh: "公司最近有没有用真金白银回报股东？"
    metrics: [evt_dividend_change, evt_net_share_reduction]
    planned_metrics: [evt_buyback]
    absence_means: unknown
    threshold:
      min_known: 1
      min_hits: 1
      hit_rules:
        - {metric: evt_dividend_change, rule: any_up_event, window_days: 30}
        - {metric: evt_net_share_reduction, rule: min_reduction, value: 0.01}
        - {metric: evt_buyback, rule: min_value, value: 0.01, window_days: 30, active_when: "staging.disclosures 有数据"}
    fail_rule: null
    measured:
      known_share: {note: "配当修正可算；回购公告 0%（TDnet 尚未入库）；股数变化须回填到上年同期。未测全家族覆盖率。"}
      hits_all: null
      hits_liquid_core: null
    independence_note: "evt_net_share_reduction 与 yield_net_payout 用同一份股数变化；evt_buyback 启用后前者转为展示。"
    evidence_summary: "回购规模证据 strong 但数据缺失，配当修正 moderate。这是目前最大的一块「证据强但拿不到」，只作可选确认，不作必要条件。"

  price_dislocation:
    name_zh: "价格错位"
    question_zh: "它最近是不是比同行跌得特别多？"
    metrics: [rev_1m]
    planned_metrics: [rev_no_news_loser]
    absence_means: no_signal
    threshold:
      min_known: 1
      min_hits: 1
      hit_rules:
        - {metric: rev_1m, rule: universe_best_pct, value: 0.10}
    fail_rule: null
    measured:
      known_share: {Prime: 1.00, Standard: 1.00, Growth: 0.99}
      hits_all: 369
      hits_liquid_core: 207
    independence_note: "与所有估值、质量指标的行业内秩相关绝对值不超过 0.15。"
    evidence_summary: "moderate：存在性好，样本老，近期扣成本后是否还在未知。10% 取自文献的最低十分位，不是调出来的。"

# ---------- 门槛 ----------
# hard：命中即移出；soft：降级或该指标不算命中；不得因为数据缺失而显示通过，未检查项必须列出。
gates:
  hard:
    - {metric: gate_regulatory_red_flags, note: "结构化部分现在可用；文本项未检查"}
    - {metric: liq_gate, note: "低于 watch 门槛移出；篮子只取 core"}
    - {metric: gate_dilution, note: "仅 MS 权证部分；TDnet 接入前未检查"}
  soft:
    - gate_distress
    - gate_sector_equity
    - gate_one_off
    - gate_div_cover
    - gate_miss_then_bullish
    - guid_remaining_growth
    - gate_inorganic
    - gate_disclosure_delay
    - gate_guidance_absent
  routing: [gate_sector_route]
  unchecked_on_current_data: [gate_zombie, gate_debt_coverage, gate_peak_earnings, gate_tangible_book, rev_cause_class]

# ---------- 篮子要求 ----------
bucket_policy:
  anchor_family: "必须 hit。该市场中此家族覆盖率低于 coverage_floor 时，该篮子在该市场暂停，不能跳过。"
  required_when_covered: "覆盖率达到 coverage_floor 时必须 hit；不足时放行并标记低置信，同时写明未检查。"
  at_least_one_of: "其中至少一个家族 hit；unknown 不算。全部低于 coverage_floor 时放行并标记低置信。"
  must_not_fail: "这些家族不得为 fail；unknown 放行，但列入未检查。"
  delay_note: "Free 上价格和财务都晚 12 周。delay_sensitive=true 的篮子在 Free 上只作研究和回放，不能代表今天的状态。"

buckets:
  B1:
    name_zh: "低估反转"
    goal_zh: "估值便宜，且有另一类证据说明不是单纯的便宜。"
    anchor_family: relative_value
    required_when_covered: []
    at_least_one_of: [business_quality, shareholder_yield, guidance_change, capital_action]
    must_not_fail: [business_quality, guidance_change]
    gates: [hard, soft]
    excluded_sectors: [保険業]
    delay_sensitive: false
    why: "G2-06、G2-07 与 Chou-Ko-Rhee 2023 都指向价值要与盈利或指引合用；G2-17 显示低 PBR 上修后更强。"
    measured_liquid_core: {total: 186, Prime: 164, Standard: 22, Growth: 0, note: "Growth 因覆盖不足暂停；只含 shareholder_yield 与 guidance_change 两个确认家族"}
  B2:
    name_zh: "指引改善"
    formerly: "质量成长"
    goal_zh: "公司刚把未来利润说得更好，生意本身也说得过去，且没有贵到离谱。"
    anchor_family: guidance_change
    required_when_covered: [business_quality]
    at_least_one_of: []
    must_not_fail: []
    valuation_cap: {metric: val_fwd_ep, rule: "不在同业最差 30%"}
    gates: [hard, soft]
    excluded_sectors: [銀行業, 保険業, 証券･商品先物取引業, その他金融業]
    delay_sensitive: true
    why: "历史增长没有日本证据（growth_hist_cagr），成长由指引信号表达；文档 B2 的 CAGR 门槛和进捗率必要条件取消。金融业排除沿用 S06。"
    measured_liquid_core: {total: 83, Prime: 51, Standard: 24, Growth: 8, note: "business_quality 覆盖不足，当前放行并标低置信"}
  B3:
    name_zh: "错杀修复"
    goal_zh: "短期比同行跌得多，但业绩预期和分红没有同等恶化。"
    anchor_family: price_dislocation
    required_when_covered: []
    at_least_one_of: []
    must_not_fail: [guidance_change]
    extra_gates: [rev_intact_test, rev_cause_class]
    gates: [hard, soft]
    excluded_sectors: []
    delay_sensitive: true
    why: "1 个月反转和无消息下跌有证据；原错杀分中的 R 和 F1 没有。TDnet 接入前归因项显示未归因，这个篮子的结论要打折。"
    measured_liquid_core: {total: 186, Prime: 123, Standard: 37, Growth: 26, note: "rev_cause_class 未检查；只扣了 guidance_change 的 fail"}
  B0:
    name_zh: "特殊情形"
    goal_zh: "TOB、MBO、行动型股东、分拆等事件单独呈现，不评分。"
    anchor_family: null
    trigger_metrics: [evt_tob_mbo_watch, own_activist]
    delay_sensitive: true
    why: "事件稀少，没有样本外预测模型。需要 TDnet 或 EDINET，当前数据下为空。"

buckets_measured_note: "以上为 2026-08-14 单日、流动性核心池（1920 只）内、扣除可用硬门槛（106 只命中，其中核心池 33 只）后的命中数，未用 S17 回退，未扣 soft 门槛中尚不能算的项。重叠：B1 与 B2 35 只，B1 与 B3 8 只，B2 与 B3 6 只。该日处于决算季，事件型数字偏高。这只是规模检查，不是收益证据。"

# ---------- 行业覆盖 ----------
# key 为 security_master.S33Nm 原文（注意半角中点 ･ 与全角中点 ・ 不同）。
# family_changes：drop 从家族中去掉的指标；use_basis 字段替换；inactive 整个家族不适用（结果记 unknown，且不计入该行业覆盖率）。
# 数字为只读实测（2026-07 至 08 的单期），文字未标实测处属制度或实务知识，未逐项核实。
sector_defaults:
  small_groups_fallback_to_s17: [鉱業, 空運業, 石油･石炭製品, 海運業, 水産・農林業, 保険業, ゴム製品]
  note: "这些行业当日不足 20 只，同业分位回退 S17。情報･通信業（603）、サービス業（533）过于混杂，行业内比较的含义也弱。"
  empty_field_rule: "字段为空时记未知，不得填 0 或行业中位。"

cyclical_sectors: [海運業, 鉄鋼, 非鉄金属, 化学, パルプ・紙, 石油･石炭製品, 鉱業]

sector_overrides:
  銀行業:
    family_changes:
      relative_value: {drop: [val_ocf_yield], note: "E/P 用 FNP"}
      business_quality: {inactive: true}
      guidance_change: {use_basis: "FOdP、FNP 代替 FOP"}
    gates_off: [gate_sector_equity, gate_distress]
    traps_zh: "OP、FOP 100% 为空，EqAR 中位 5%，CFO 约 99% 为空。要看规制资本、信用成本、证券处置收益；满期保有含み损不进净资产，利率上行时账面可能偏高。这些 Free 都没有。"
  保険業:
    family_changes:
      relative_value: {inactive: true}
      business_quality: {inactive: true}
      guidance_change: {inactive: true}
    gates_off: [gate_sector_equity, gate_distress]
    traps_zh: "OP 64% 为空、FOP 71% 为空、Sales 22% 为空。通用指标不适用，应看 EV 或修正利润，不进自动评分。"
  証券･商品先物取引業:
    family_changes:
      relative_value: {drop: [val_ocf_yield], use_basis: "FwdEPS 只有 27%，val_fwd_ep 走 TTM 回退"}
      business_quality: {inactive: true}
      guidance_change: {inactive: true}
    gates_off: [gate_sector_equity, gate_distress]
    traps_zh: "FEPS 81% 为空，受行情影响大，PER 不可靠。无指引不是负面。"
  その他金融業:
    family_changes:
      relative_value: {drop: [val_ocf_yield]}
      business_quality: {inactive: true}
    gates_off: [gate_sector_equity]
    traps_zh: "杠杆就是业务本身，EqAR<30% 占 57%。净现金和固定自有资本比率没有意义。"
  不動産業:
    family_changes:
      relative_value: {drop: [val_ocf_yield]}
      business_quality: {drop: [], note: "F-Score 的 CFO 两项不可靠，只算其余项"}
    gates_off: []
    traps_zh: "FwdPER<10 占 56%，EqAR<30% 占 42.5%。低 PER 是常态，购地让 CFO 为负，4Q 集中使进捗率失真。看含み益和利率敏感度。"
  電気･ガス業:
    family_changes: {}
    gates_off: []
    traps_zh: "PBR<1 占 85%，EqAR<30% 占 41%，约 20% 无 FOP。燃料调整时滞使利润摆动，核电和监管是主要判断点。"
  空運業:
    family_changes: {}
    gates_off: []
    traps_zh: "约 20% 无 FOP，EqAR<30% 占 40%，只有 5 只，回退 S17。"
  海運業:
    family_changes:
      guidance_change: {use_basis: "OdP、FOdP 代替 OP、FOP；guid_forecast_innovation 已按 odp 口径"}
    gates_off: [gate_one_off]
    traps_zh: "OdP/OP 中位 1.23，FNP/FOP 中位 1.59，FwdPER<10 占 36%。OP 口径失真，低 PER 要先判断周期位置，当前算未检查。"
  卸売業:
    family_changes:
      guidance_change: {use_basis: "FOP 为空的公司（五大商社 5/5）改用 FNP、NP"}
      business_quality: {note: "OP 为空的公司 qual_op_profitability 记未知"}
    gates_off: []
    traps_zh: "五大商社全部 IFRS，FOP 全空，有 OP 者 NP/OP 中位 1.42（n 很小）。注意持分法和资源价格周期，其他卸売公司照常。"
  鉄鋼:
    family_changes: {}
    gates_off: []
    traps_zh: "PBR<1 占 76%，在库评价损益影响利润，看周期位置。"
  化学:
    family_changes: {}
    gates_off: []
    traps_zh: "在库评价损益影响利润，看中期利润率。"
  非鉄金属:
    family_changes: {}
    gates_off: []
    traps_zh: "资源价格带动利润，低 PER 先判断周期位置。"
  パルプ・紙:
    family_changes: {}
    gates_off: []
    traps_zh: "PBR<1 占 91%，只有行业内比较才有意义。"
  石油･石炭製品:
    family_changes: {}
    gates_off: []
    traps_zh: "PBR<1 占 88%，EqAR<30% 占 50%，在库评价损益大，只有 9 只。"
  建設業:
    family_changes: {}
    gates_off: []
    traps_zh: "1Q 进捗率中位只有 18.8%，看受注残和工事损失；应计比率差异大。"
  機械:
    family_changes: {}
    gates_off: []
    traps_zh: "看受注高，1Q 进度偏低不等于出问题。"
  情報･通信業:
    family_changes: {}
    gates_off: []
    traps_zh: "PBR<1 只占 9%，行业过于混杂（603 只），FEPS 约 21% 为空。SI 公司看受注残，互联网公司 PBR 意义有限。"
  サービス業:
    family_changes: {}
    gates_off: []
    traps_zh: "533 只，业务差别大，行业内分位含义弱。"
  医薬品:
    family_changes: {}
    gates_off: []
    traps_zh: "31% 无预想，25% IFRS，Sales 14% 为空。减损计入营业利润，要看管线和专利。"
  小売業:
    family_changes: {}
    gates_off: []
    traps_zh: "非 3 月决算多，看月次、租赁和股东优待。优待废止引发的下跌是资金结构变化，不是错杀，须 TDnet 才能分清。"
  輸送用機器:
    family_changes: {}
    gates_off: []
    traps_zh: "约 22% IFRS，跨准则比较打折扣。"

market_overrides:
  Growth:
    family_changes:
      relative_value: {note: "家族仍可算，但 B1 在 Growth 不启用（excluded_markets）；ROE 对 PBR 的解释力太低，残差不算"}
      shareholder_yield: {inactive: true, note: "预告零分红 58%"}
    traps_zh: "PBR<1 只占 7%，27% 无预想，核心池只有 161 只。估值逻辑走不通时不要硬套。"

# ---------- 数据来源与解锁 ----------
# priority：1 最先。费用和条款见规划文档 3.2、19.1 节。
data_sources:
  - id: tdnet_daily
    name_zh: "TDnet 每日采集"
    priority: 1
    cost: "免费"
    state: "作业代码已有（jobs/ingest_tdnet.py），读取时 staging.disclosures 还没有数据"
    worth_it: "最高，每拖一天就永久少一天：官方站只保留约 31 日"
    unlocks: [evt_buyback, rev_cause_class, gate_dilution, gate_regulatory_red_flags, news_handcrafted_score, evt_tob_mbo_watch]
    limits: "不能用于历史回测；公开披露信息，低频采集；价格仍受 Free 延迟限制。"
  - id: edinet_key
    name_zh: "EDINET API Key"
    priority: 1
    cost: "免费，需本人注册 Key"
    state: "连接器正在开发；需要用户把 EDINET_API_KEY 写入 .env"
    worth_it: "最高：不花钱补上负债、利息、持股结构这个最大缺口"
    unlocks: [gate_zombie, gate_debt_coverage, gate_peak_earnings, gate_tangible_book, val_ev_ebitda, val_net_cash, val_hidden_asset_rnav, val_investment_securities, qual_gross_profit, qual_roic, own_foreign_individual, own_activist, own_parent_sub, own_cross_holding, text_mdna_tone]
    limits: "年度和半期为主，3 月决算一般 6 月才有；解析成本和字段覆盖率未实测；单线程按日回填，注明出典。"
  - id: backfill_free
    name_zh: "完成 Free 回填"
    priority: 1
    cost: "免费，正在进行"
    state: "进行中"
    worth_it: "必须"
    unlocks: [qual_fscore7, qual_op_profitability, val_ocf_yield, yield_net_payout, guid_forecast_innovation, evt_net_share_reduction, gate_miss_then_bullish, guid_remaining_growth]
    limits: "只有 2 年、2 个财年；这 2 年是单边上涨市，不足以校准任何阈值。"
  - id: jpx_files
    name_zh: "JPX 免费文件"
    priority: 2
    cost: "免费"
    state: "监理、改善、资本成本、退市、TOPIX 权重已入库；jpx_per_pbr_monthly 最新月只到 2024-08，需负责模块核查"
    worth_it: "是，成本低"
    unlocks: [evt_index_flow]
    limits: "条款禁止再配信，只本地使用。周次信用 PDF 机器可读性差。"
  - id: jquants_standard
    name_zh: "J-Quants Standard"
