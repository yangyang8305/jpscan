  # ---------- 指引变化 ----------
  - id: guid_forecast_innovation
    family: guidance_change
    aliases: [SUPF, NEXT_FY_GUIDANCE]
    name_zh: "翌期指引意外"
    plain_zh: "公司发年报时，给的明年利润预测比今年实际高多少（相对市值）。"
    purpose: catalyst_event
    direction: higher_better
    formula: "仅 FY 决算行，按字段回退：JP 准则有 NxFOdP、OdP 时 NxFOdP − OdP（口径 odp）；否则有 NxFOP、OP 时 NxFOP − OP（口径 op）；否则 NxFNp − NP（口径 np）；都没有记未知。除以公告前一交易日 MktCap*1e6，再减同业（peer_group）中位得 adj；在同口径内排名，口径组不足 20 只不评。排名池是过去 250 个交易日的全部 FY 行，信号有效窗口是 DiscDate 后第 2 至第 60 个交易日。FY 行的 FOP 全空，要读 Nx 字段。"
    data_needed: "financial_statements.NxFOP, NxFOdP, NxFNp, OP, OdP, NP, gaap, DocType, CurPerType, DiscDate；valuation_daily.MktCap"
    available_on_free_plan: true
    free_plan_note: "FY 决算行 NxFOP 88%。读取时有 FY 行的只有 Prime 8%、Standard 13%、Growth 18%（3 月决算的 5 月数据大多未回填）。"
    stale_on_free: true
    unlocks_with: "回测：回填到 2025-05。实盘：J-Quants Light 以上去掉延迟；TDnet 摘要 XBRL 可免费拿到近实时的预想数字，但价格仍延迟。"
    sector_rules: "银行走 odp 口径；保险、证券不适用（预想多缺失）。无 NxFOP 不只是五大商社，IFRS 公司约四分之一都没有（日本製鉄、三菱重工、豊田通商 等），所以按字段回退，不按行业写。"
    status: score
    planned_status: score
    evidence_strength: moderate
    evidence: "日本最符合制度的信号。G2-19 Jinushi 2023（全文已读，2002-2020，60124 公司年）：指引意外对公告后 +2 至 +60 日异常收益的系数在所有样本中显著为正，同期的实绩意外几乎不显著；外资高或个人低的公司漂移在减弱。G2-14 讲的是公告日反应，不是公告后可交易的漂移。strong 只适用于低外资、高个人持股子样本；B2 只取流动性核心池，这类公司偏少（未实测，无持股数据；依据是这里对 Jinushi 的转述，未重读原文）。https://www.rieb.kobe-u.ac.jp/tjar/article/vol13/pdf/13.01.Jinushi.pdf 实测（2026-06-30，旧规则按 gaap 全市场排名）：銀行 hit 66%，電気･ガス fail 57%、海運 fail 70%，等于在押行业；减同业中位后 銀行 hit 25%，電気･ガス fail 35%、海運 fail 20%。旧的 60 日滚动排名有断崖：08-14 窗口内只剩约 350 个 FY 行，JP 组 30 分位由 −0.5% 变成 −0.04%。"
    why: "草案的 G3 用当期预想且混在成长分里，应单独成为事件信号。它是日本证据较直接的信号，但窗口正好落在 Free 的 12 周延迟之内，实盘须用无延迟数据。"

  - id: guid_revision_event
    family: guidance_change
    aliases: [N6, REVISION_EVENT]
    name_zh: "业绩预想修正"
    plain_zh: "财年中公司上调或下调全年利润预测的方向和幅度。"
