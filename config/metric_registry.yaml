    free_plan_note: "TTM ROE 覆盖 Prime 98%、Standard 98%、Growth 92%。文档字段 ROE 只在 FY 有，季度为 0%，勿用。3 年平均算不出。"
    stale_on_free: false
    unlocks_with: "3 年平均：J-Quants Light 以上"
    sector_rules: "银行、证券的 PBR 主要用它解释。ROE 被一次性利润抬高时看 gate_one_off。"
    status: display
    planned_status: display
    evidence_strength: moderate
    evidence: "G2-06、G2-07、G2-12。"
    why: "已是残差的输入，再单独计分等于重复计算。"

  - id: qual_roic
    family: business_quality
    aliases: [Q2]
    name_zh: "ROIC"
    plain_zh: "连借来的钱算在内，公司的投入每年能赚多少。"
