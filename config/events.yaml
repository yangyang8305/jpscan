    extract: ["op_revision_pct", "sales_revision_pct", "np_revision_pct"]
    notes: "抽取修正幅度（営業利益 %）；修正后约 1 个月存在漂移（PEAD 证据）。通用「業績予想の修正」由 families.earnings_revision 处理"
