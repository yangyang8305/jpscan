# 事件分类表（规划文档 附录 D）：TDnet / EDINET / 新闻标题 → 类别 → 方向 / 强度 / 半衰期
# 由 jpscan.events.classify 读取。规则层零成本；AI（A3）只处理 needs_ai=true 或未命中的标题，并须引用原文。
#
# 匹配规则（classify_title）：
#   - 标题与关键词都做同一归一化：NFKC（全角→半角、ＭＢＯ→MBO）、去掉所有空白、括号统一（〔〕［］【】→[]）、ASCII 小写。
#   - 关键词为「精确子串」匹配；category.exclude 命中则该类别不参与；all_of 为「同时包含多个子串」的组合规则。
#     例外：≤5 字符的纯 ASCII 关键词（mbo、msci…）要求词边界，否则 embodying 会命中 MBO；families.*.all_of_unless 命中时该家族的 all_of 不生效。
#   - 优先级：① hard_exclude 类别（最长关键词优先，等长取代码小者）
#             ② E38 訂正（标题以「(訂正」等前缀开头或含 E38 关键词；underlying 给出被订正内容的类别）
#             ③ 修正类：E01/E02（families.earnings_revision）与 E03/E04（families.dividend_revision），方向由 cue 决定；
#                无 cue 或正负 cue 同时出现 → 方向未定，返回 undetermined 中的伪类别（E01/E02、E03/E04），needs_ai=true
#             ④ 其余类别按最长关键词，等长取代码小者
#             ⑤ 均未命中 → E40
#   - needs_ai：类别自身 needs_ai=true、修正方向未定、或多个命中类别方向相反（冲突）时为 true。
# 字段：direction ∈ {+1, -1, 0}；strength ∈ [-3, 3]；half_life_days 为交易日（null = 不衰减 / 不适用）；
#       hard_exclude 触发硬排除；special 进入特殊情形池；download 为 PDF 下载白名单；keyword_strength 为关键词级强度覆盖。
version: "0.1.0"
as_of: "2026-11-07"
source: "docs/日股全量扫描与组合构建_研究与实施规划_v0.1.md 附录 D / 4.7 节"

# 英文披露识别标记（命中即 lang=en；另有 ASCII 字母占比规则）
lang_markers: ["[英訳]", "(英訳)", "英訳", "[english]", "(english)", "english version", "english translation", "英語版"]

# 这些类别即使 PDF 不在白名单，也始终下载 XBRL zip（决算短信 / 業績予想・配当予想修正含结构化数值）
xbrl_always: ["E37", "E01", "E02", "E03", "E04", "E01/E02", "E03/E04"]

# 修正类「家族」：关键词命中后由 cue 决定正负类别
families:
  earnings_revision:
    positive: "E01"
    negative: "E02"
    undetermined: "E01/E02"
    keywords: ["業績予想の修正", "業績予想修正", "業績予想を修正", "業績予想の変更", "業績予想数値の修正", "業績見通しの修正",
               "業績予想値の修正", "利益予想の修正", "実績との差異", "実績値との差異", "決算値との差異", "実績の差異", "実積の差異",
               "予想値と実績値", "予想と実績", "revision of earnings forecast", "revisions of earnings forecast",
               "revision to earnings forecast", "revisions to earnings forecast", "revision of consolidated earnings forecast",
               "revision of financial forecast", "revision of forecast", "revised earnings forecast", "earnings forecast revision",
               "difference between forecast", "differences between forecast", "differences between the forecast"]
    all_of: [["業績予想", "修正"], ["業績見通し", "修正"], ["業績予想", "差異"], ["業績予想", "変更"],
             ["forecast", "revision"], ["forecasts", "revision"], ["forecast", "revised"], ["forecast", "difference"]]
    all_of_unless: ["dividend"]   # 英文 Revision of Dividend Forecast 属配当家族，不能靠 forecast+revision 算业绩修正
    cues_positive: ["上方", "増額", "上振れ", "上回る", "upward", "increase"]
    cues_negative: ["下方", "減額", "下振れ", "下回る", "downward", "decrease"]
  dividend_revision:
    positive: "E03"
    negative: "E04"
    undetermined: "E03/E04"
    keywords: ["配当予想の修正", "配当予想修正", "配当予想を修正", "配当予想の変更", "配当予想額の修正", "配当金の修正",
               "revision of dividend forecast", "revisions of dividend forecast", "revision to dividend forecast",
               "revision of year-end dividend forecast", "revision of the dividend forecast", "dividend forecast revision"]
    all_of: [["配当予想", "修正"], ["配当予想", "変更"], ["dividend", "revision"], ["dividend", "revised"]]
    cues_positive: ["増配", "復配", "記念配当", "特別配当", "上方", "増額", "increase", "commemorative", "resumption", "special dividend"]
    cues_negative: ["減配", "無配", "下方", "減額", "見送り", "取りやめ", "取り止め", "decrease", "no dividend", "suspension", "omission", "omit"]

# 伪类别：修正方向未定时返回（strength 0，等待 XBRL 数值或 AI 判定）
undetermined:
  "E01/E02": {name: "業績予想修正（方向未定）", direction: 0, strength: 0, half_life_days: 20, hard_exclude: false, special: false, download: true,
              notes: "标题无上方/下方 cue；若 XBRL(rvfc) 可用则按新旧予想数值判定方向，否则交 AI（A3）"}
  "E03/E04": {name: "配当予想修正（方向未定）", direction: 0, strength: 0, half_life_days: 20, hard_exclude: false, special: false, download: true,
              notes: "标题无増配/減配 cue；若 XBRL(rvdf) 可用则按新旧配当数值判定方向，否则交 AI（A3）"}

categories:
